<svg viewBox="0 0 560 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Illustration of a city map with a route, landmarks, a restaurant and location pins</title>
  <defs>
    <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Ambient background blob -->
  <path d="M60 240 C 20 130, 150 20, 280 30 C 420 40, 540 110, 520 240 C 500 370, 370 460, 250 450 C 120 440, 100 350, 60 240 Z" fill="url(#blobGrad)"/>

  <!-- Map card -->
  <rect x="60" y="70" width="440" height="340" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Map grid roads -->
  <g stroke="#E2E8F0" stroke-width="6" stroke-linecap="round">
    <line x1="60" y1="160" x2="500" y2="150"/>
    <line x1="60" y1="260" x2="500" y2="270"/>
    <line x1="60" y1="340" x2="500" y2="335"/>
    <line x1="160" y1="70" x2="150" y2="410"/>
    <line x1="300" y1="70" x2="310" y2="410"/>
    <line x1="420" y1="70" x2="430" y2="410"/>
  </g>

  <!-- Route (dashed) -->
  <path d="M110 355 C 160 320, 150 270, 210 250 C 270 230, 300 190, 320 150 C 335 120, 380 110, 430 115"
        fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/>

  <!-- Landmark (building) -->
  <g transform="translate(330,140)">
    <rect x="-26" y="-10" width="52" height="70" rx="6" fill="#0F172A" opacity="0.85"/>
    <rect x="-16" y="4" width="10" height="10" rx="2" fill="#F8FAFC"/>
    <rect x="0" y="4" width="10" height="10" rx="2" fill="#F8FAFC"/>
    <rect x="-16" y="22" width="10" height="10" rx="2" fill="#F8FAFC"/>
    <rect x="0" y="22" width="10" height="10" rx="2" fill="#F8FAFC"/>
    <rect x="-10" y="40" width="20" height="20" rx="2" fill="#F8FAFC"/>
    <polygon points="-30,-10 0,-34 30,-10" fill="#14B8A6"/>
  </g>

  <!-- Restaurant marker -->
  <g transform="translate(190,300)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#14B8A6" stroke-width="4"/>
    <g stroke="#14B8A6" stroke-width="3" stroke-linecap="round">
      <line x1="-9" y1="-9" x2="-9" y2="9"/>
      <line x1="-13" y1="-9" x2="-13" y2="-2"/>
      <line x1="-5" y1="-9" x2="-5" y2="-2"/>
      <path d="M8 -9 C 4 -9, 4 -1, 8 -1 L 8 9"/>
    </g>
  </g>

  <!-- Primary destination pin -->
  <g transform="translate(430,110)">
    <path d="M0 -46 C 22 -46, 34 -30, 34 -12 C 34 14, 0 46, 0 46 C 0 46, -34 14, -34 -12 C -34 -30, -22 -46, 0 -46 Z" fill="url(#pinGrad)"/>
    <circle cx="0" cy="-12" r="12" fill="#FFFFFF"/>
  </g>

  <!-- Secondary pin -->
  <g transform="translate(110,355)">
    <path d="M0 -30 C 14 -30, 22 -20, 22 -8 C 22 9, 0 30, 0 30 C 0 30, -22 9, -22 -8 C -22 -20, -14 -30, 0 -30 Z" fill="url(#cardGrad)"/>
    <circle cx="0" cy="-8" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Small floating event tag -->
  <g transform="translate(430,300)">
    <rect x="-40" y="-22" width="80" height="44" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="-14" cy="0" r="5" fill="#F59E0B"/>
    <rect x="-2" y="-5" width="30" height="4" rx="2" fill="#F59E0B" opacity="0.8"/>
    <rect x="-2" y="3" width="22" height="4" rx="2" fill="#F59E0B" opacity="0.5"/>
  </g>
</svg>
